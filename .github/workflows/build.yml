name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Patch network library for P60
        run: |
          set -e
          F=libraries/humla/src/main/java/se/lublin/humla/net/HumlaConnection.java
          echo "--- ping scheduling before patch"
          grep -n 'scheduleAtFixedRate' "$F"
          grep -q 'scheduleAtFixedRate(mPingRunnable, 0, 5, TimeUnit.SECONDS)' "$F"
          sed -i 's/scheduleAtFixedRate(mPingRunnable, 0, 5, TimeUnit.SECONDS)/scheduleAtFixedRate(mPingRunnable, 0, Integer.getInteger("mumla.p60.pingInterval", 5), TimeUnit.SECONDS)/' "$F"
          echo "--- after patch"
          grep -n 'mumla.p60.pingInterval' "$F"

      - name: Show library source used for the build
        run: |
          cd libraries/humla/src/main/java/se/lublin/humla
          for f in net/HumlaConnection.java audio/AudioInput.java HumlaService.java protocol/AudioHandler.java audio/inputmode/ToggleInputMode.java; do
            echo "=================== $f"
            cat -n "$f"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;25.1.8937393"

      - name: Build humla-spongycastle
        working-directory: libraries/humla/libs/humla-spongycastle
        run: ../../gradlew jar

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleFossDebug

      - name: Collect APK
        run: |
          ls -R app/build/outputs/apk
          cp "$(find app/build/outputs/apk/foss/debug -name '*.apk' | head -n 1)" "mumla-p60-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mumla-p60
          path: mumla-p60-build${{ github.run_number }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "mumla-p60-build${{ github.run_number }}.apk" \
            --title "Mumla P60 - сборка ${{ github.run_number }}" \
            --notes "Автоматическая сборка. Скачайте файл APK и установите на рацию."
